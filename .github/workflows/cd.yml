name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: e-learning-ntu-be
          - name: web
            context: e-learning-ntu-fe
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest,ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.sha }}
